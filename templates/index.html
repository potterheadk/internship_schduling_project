<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UMA Unified Schedule Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Load Main Global Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/viewer.css') }}">
    <!-- Phosphor Icons (Lightweight icon library) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body>

    <div class="app-shell">

        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <a href="/" class="back-link">
                    <i class="ph ph-arrow-left"></i> Back to Home
                </a>
                <div class="title-group">
                    <h1>Schedule Explorer</h1>
                    <p>Drag sessions to reschedule. Click to edit details.</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="resetFiltersBtn" class="btn-secondary">
                    <i class="ph ph-funnel-x"></i> Clear Filters
                </button>
                <button id="refreshBtn" class="btn-secondary">
                    <i class="ph ph-arrows-clockwise"></i> Refresh
                </button>
                <button id="langToggle"
                    style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; cursor: pointer; padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s ease;">🇺🇸
                    EN</button>
                <img src="{{ url_for('static', filename='imgs/uma-logo.png') }}" alt="UMA Logo" class="header-logo">
                <button id="regenBtn" class="btn-danger">
                    <i class="ph ph-warning-circle"></i> Admin: Regenerate
                </button>
            </div>
        </header>

        <!-- Controls & Status -->
        <div class="control-panel panel">
            <!-- Dynamic Filters -->
            <div id="filterContainer" class="filters-grid">
                <!-- Selects injected via JS -->
            </div>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <span id="statusDot" class="dot"></span>
                    <span id="statusText">System Ready</span>
                </div>
                <div class="legend">
                    <span class="legend-item"><span class="color-box lab"></span> Lab</span>
                    <span class="legend-item"><span class="color-box theory"></span> Theory</span>
                    <span class="legend-item"><span class="color-box virtual"></span> Virtual</span>
                    <span class="legend-item"><span class="color-box conflict"></span> Conflict</span>
                </div>
            </div>
        </div>

        <!-- Main Calendar Grid -->
        <div class="calendar-wrapper panel">
            <table class="calendar-grid">
                <thead>
                    <tr>
                        <th class="time-header">Time</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- JS will render rows here -->
                </tbody>
            </table>
        </div>

        <!-- Unscheduled / Backup Section -->
        <div id="unscheduledSection" class="unscheduled-wrapper panel hidden">
            <div class="section-header">
                <i class="ph ph-warning"></i>
                <h3>Unscheduled Sessions</h3>
            </div>
            <div id="unscheduledGrid" class="unscheduled-grid"></div>
        </div>

    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal-backdrop hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Session</h3>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editSessionId">

                    <div class="form-group">
                        <label>Course Name</label>
                        <input type="text" id="editCourse" disabled class="input-disabled">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Day</label>
                            <select id="editDay">
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="Saturday">Saturday</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Start Time</label>
                            <select id="editTime">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Room ID (Type 'VIRTUAL' for online)</label>
                        <input type="text" id="editRoom">
                    </div>

                    <div class="form-group">
                        <label>Teacher</label>
                        <input type="text" id="editTeacher">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary close-modal">Cancel</button>
                <button type="button" id="saveSessionBtn" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='js/viewer.js') }}"></script>

    <!-- Google Translation script -->
    <script src="{{ url_for('static', filename='js/translation.js') }}"></script>
</body>

</html>
